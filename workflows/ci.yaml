name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: check build tools
        run: |
          cmake --version
          ctest --version

      - name: cache dependency sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/yaml-cpp-src
            build/_deps/googletest-src
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: configure project
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=17
          -DDATACONV_BUILD_TESTS=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: build project
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        working-directory: build
        run: >
          ctest -C Release
          --output-on-failure
          --no-tests=error
          --output-junit test-results.xml

      - name: upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: all platforms passed
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: confirm success
        run: echo "Build and tests passed on all platforms"
