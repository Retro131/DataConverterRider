name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: check build tools
        run: |
          cmake --version
          ctest --version

      - name: cache dependency sources
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/dependencies/yaml-cpp-src
            ${{ github.workspace }}/dependencies/googletest-src
          key: dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configure project without cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=17
          -DDATACONV_BUILD_TESTS=ON
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/dependencies"

      - name: configure project with cache
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=17
          -DDATACONV_BUILD_TESTS=ON
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/dependencies"
          -DFETCHCONTENT_SOURCE_DIR_YAML-CPP="${{ github.workspace }}/dependencies/yaml-cpp-src"
          -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="${{ github.workspace }}/dependencies/googletest-src"

      - name: build project
        run: cmake --build build --config Release --parallel 2

      - name: run tests
        working-directory: build
        run: >
          ctest -C Release
          --output-on-failure
          --no-tests=error
          --output-junit test-results.xml

      - name: upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: all platforms passed
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: confirm success
        run: echo "Build and tests passed on all platforms"
